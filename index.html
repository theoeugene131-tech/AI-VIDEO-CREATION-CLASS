<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Creation for Beginners — Course</title>
<style>
  :root {
    --bg: #f6f4f0;
    --card: #ffffff;
    --ink: #1c1a17;
    --muted: #6b655c;
    --accent: #c2570b;
    --accent-soft: #fdf0e3;
    --green: #1e7d46;
    --red: #b3261e;
    --line: #e6e1d8;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 290px;
    flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--line);
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar h1 { font-size: 17px; line-height: 1.35; margin-bottom: 4px; padding: 0 8px; }
  .sidebar .sub { font-size: 12px; color: var(--muted); padding: 0 8px 16px; }
  .progress-wrap { padding: 0 8px 16px; }
  .progress-bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width .4s ease; }
  .progress-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .lesson-list { list-style: none; margin-top: 8px; }
  .lesson-item button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 10px;
    border: none;
    background: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
    color: var(--ink);
    transition: background .15s;
  }
  .lesson-item button:hover { background: var(--bg); }
  .lesson-item.active button { background: var(--accent-soft); font-weight: 600; }
  .lesson-num {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--line);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    flex-shrink: 0;
  }
  .lesson-item.active .lesson-num { background: var(--accent); color: #fff; }
  .lesson-item.done .lesson-num { background: var(--green); color: #fff; }
  .lesson-item.done .lesson-num::after { content: "✓"; }
  .lesson-item.done .lesson-num span { display: none; }
  .lesson-num span { display: inline; }
  .menu-toggle { display: none; }

  /* ---------- Main ---------- */
  .main { flex: 1; padding: 32px 28px 80px; max-width: 860px; }
  .lesson-head { margin-bottom: 20px; }
  .lesson-kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .lesson-head h2 { font-size: 28px; line-height: 1.25; margin: 4px 0 8px; }
  .lesson-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 20px;
  }
  .card h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h3 .icon { font-size: 18px; }

  /* audio */
  .audio-box audio { width: 100%; display: block; }
  .audio-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .audio-note a { color: var(--accent); }

  /* lesson text */
  .lesson-section { margin-bottom: 16px; }
  .lesson-section h4 { font-size: 14.5px; color: var(--accent); margin-bottom: 6px; }
  .lesson-section p { font-size: 15px; margin-bottom: 10px; color: #33302b; }

  /* video script table */
  .video-script table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .video-script th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); }
  .video-script td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .video-script tr td:first-child { white-space: nowrap; font-weight: 600; color: var(--accent); width: 90px; }

  /* quiz */
  .quiz-q { margin-bottom: 18px; }
  .quiz-q p.q { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .quiz-opt { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 14.5px; }
  .quiz-opt:hover { background: var(--bg); }
  .quiz-opt input { margin-top: 4px; accent-color: var(--accent); }
  .quiz-opt.correct { background: #e9f5ee; }
  .quiz-opt.correct .opt-letter { color: var(--green); font-weight: 700; }
  .quiz-opt.wrong { background: #fbeae8; }
  .quiz-opt.wrong .opt-letter { color: var(--red); font-weight: 700; }
  .quiz-opt.disabled { pointer-events: none; }
  .quiz-feedback { font-size: 13px; color: var(--muted); margin-top: 6px; display: none; }
  .quiz-feedback.show { display: block; }
  .quiz-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .quiz-score { font-size: 15px; font-weight: 700; }
  .quiz-score.pass { color: var(--green); }
  .quiz-score.fail { color: var(--red); }

  /* exercise */
  .exercise ol { padding-left: 20px; }
  .exercise li { font-size: 14.5px; margin-bottom: 8px; }

  /* nav */
  .lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }
  .lesson-nav .btn { min-width: 130px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* welcome */
  .welcome { text-align: center; padding: 60px 24px; }
  .welcome h2 { font-size: 30px; margin-bottom: 12px; }
  .welcome p { color: var(--muted); max-width: 520px; margin: 0 auto 24px; }
  .welcome .stats { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
  .welcome .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 22px; min-width: 130px; }
  .welcome .stat b { display: block; font-size: 24px; color: var(--accent); }
  .welcome .stat span { font-size: 13px; color: var(--muted); }

  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--line); padding: 14px; }
    .sidebar .lesson-list { display: none; }
    .sidebar.open .lesson-list { display: block; }
    .menu-toggle {
      display: inline-flex; align-items: center; gap: 8px;
      background: none; border: 1px solid var(--line); border-radius: 8px;
      padding: 7px 12px; font-size: 13px; cursor: pointer; margin-bottom: 10px;
    }
    .main { padding: 20px 16px 60px; }
    .lesson-head h2 { font-size: 23px; }
  }
</style>
</head>

  <main class="main" id="main"></main>
</div>

        { h: "1. Why most AI videos look random", p: [

/* ================= STATE ================= */
const STORE_KEY = "aiVideoCourseProgress_v1";
let state = loadState();
let current = 0; // -1 = welcome

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && typeof s === "object") return { done: s.done || {}, scores: s.scores || {} };
  } catch (e) {}
  return { done: {}, scores: {} };
}
function saveState() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

/* ================= RENDER ================= */
const main = document.getElementById("main");
const lessonList = document.getElementById("lessonList");

function renderSidebar() {
  lessonList.innerHTML = "";
  COURSE.lessons.forEach((l, i) => {
    const li = document.createElement("li");
    li.className = "lesson-item" + (state.done[l.id] ? " done" : "") + (i === current ? " active" : "");
    const btn = document.createElement("button");
    btn.innerHTML = '<span class="lesson-num"><span>' + l.id + "</span></span><span>" + l.title + "</span>";
    btn.addEventListener("click", () => { current = i; render(); });
    li.appendChild(btn);
    lessonList.appendChild(li);
  });
  const doneCount = COURSE.lessons.filter(l => state.done[l.id]).length;
  document.getElementById("progressFill").style.width = (doneCount / COURSE.lessons.length * 100) + "%";
  document.getElementById("progressLabel").textContent =
    doneCount + " of " + COURSE.lessons.length + " lessons completed";
}

function render() {
  renderSidebar();
  if (current === -1) { renderWelcome(); return; }
  const l = COURSE.lessons[current];
  const score = state.scores[l.id];

  let html = "";
  html += '<div class="lesson-head">';
  html += '<div class="lesson-kicker">Lesson ' + l.id + " of " + COURSE.lessons.length + "</div>";
  html += "<h2>" + l.title + "</h2>";
  html += '<div class="lesson-meta"><span class="chip">🎬 ' + l.length + '</span><span class="chip">🎯 ' + l.goal + "</span></div>";
  html += "</div>";

  // audio
  html += '<div class="card"><h3><span class="icon">🔊</span> Lesson audio</h3>';
  html += '<div class="audio-box"><audio controls preload="none" src="audio/lesson-' + l.id + '.mp3">Your browser does not support the audio element.</audio></div>';
  html += '<div class="audio-note">Audio plays from <code>audio/lesson-' + l.id + '.mp3</code>. To use higher-quality narration, export an MP3 from ElevenLabs (see <code>audio/README.md</code>) and save it with the same file name — the player picks it up automatically.</div>';
  html += "</div>";

  // lesson text
  html += '<div class="card"><h3><span class="icon">📖</span> Lesson notes</h3>';
  l.sections.forEach(s => {
    html += '<div class="lesson-section"><h4>' + s.h + "</h4>";
    s.p.forEach(p => { html += "<p>" + p + "</p>"; });
    html += "</div>";
  });
  html += "</div>";

  // video script
  html += '<div class="card video-script"><h3><span class="icon">🎥</span> Video script <span style="font-weight:400;font-size:12px;color:var(--muted)">(for recording your own version)</span></h3>';
  html += "<table><thead><tr><th>Time</th><th>On screen</th><th>Audio / notes</th></tr></thead><tbody>";
  l.videoScript.forEach(v => {
    html += "<tr><td>" + v.t + "</td><td>" + v.screen + "</td><td>" + v.audio + "</td></tr>";
  });
  html += "</tbody></table></div>";

  // quiz
  html += '<div class="card" id="quizCard"><h3><span class="icon">✅</span> Quiz — 5 questions</h3><div id="quizBody">';
  l.quiz.forEach((q, qi) => {
    html += '<div class="quiz-q" data-q="' + qi + '"><p class="q">' + (qi + 1) + ". " + q.q + "</p>";
    q.options.forEach((opt, oi) => {
      html += '<label class="quiz-opt" data-oi="' + oi + '"><input type="radio" name="q' + qi + '" value="' + oi + '"><span class="opt-letter">' + "ABCD"[oi] + '.</span> <span>' + opt + "</span></label>";
    });
    html += '<div class="quiz-feedback" id="fb-' + qi + '"></div></div>';
  });
  html += "</div>";
  html += '<div class="quiz-actions"><button class="btn" id="checkBtn">Check answers</button><button class="btn secondary" id="retryBtn">Retry</button><span class="quiz-score" id="quizScore"></span></div>';
  html += "</div>";

  // exercise
  html += '<div class="card exercise"><h3><span class="icon">💪</span> Exercise</h3><ol>';
  l.exercise.forEach(e => { html += "<li>" + e + "</li>"; });
  html += "</ol></div>";

  // nav
  html += '<div class="lesson-nav">';
  html += '<button class="btn secondary" id="prevBtn"' + (current === 0 ? " disabled" : "") + ">← Previous</button>";
  if (current < COURSE.lessons.length - 1) {
    html += '<button class="btn" id="nextBtn">Next lesson →</button>';
  } else {
    html += '<button class="btn" id="finishBtn">Finish course ✓</button>';
  }
  html += "</div>";

  main.innerHTML = html;

  // quiz events
  document.getElementById("checkBtn").addEventListener("click", checkQuiz);
  document.getElementById("retryBtn").addEventListener("click", () => {
    document.querySelectorAll(".quiz-opt").forEach(o => {
      o.classList.remove("correct", "wrong", "disabled");
      o.querySelector("input").checked = false;
    });
    document.querySelectorAll(".quiz-feedback").forEach(f => f.classList.remove("show"));
    document.getElementById("quizScore").textContent = "";
    document.getElementById("quizScore").className = "quiz-score";
  });
  document.getElementById("prevBtn").addEventListener("click", () => { if (current > 0) { current--; render(); window.scrollTo(0, 0); } });
  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", () => { current++; render(); window.scrollTo(0, 0); });
  const finishBtn = document.getElementById("finishBtn");
  if (finishBtn) finishBtn.addEventListener("click", () => { current = -1; render(); window.scrollTo(0, 0); });
}

function checkQuiz() {
  const l = COURSE.lessons[current];
  let correct = 0;
  l.quiz.forEach((q, qi) => {
    const qEl = document.querySelector('.quiz-q[data-q="' + qi + '"]');
    const chosen = qEl.querySelector("input:checked");
    const fb = document.getElementById("fb-" + qi);
    qEl.querySelectorAll(".quiz-opt").forEach(o => o.classList.add("disabled"));
    if (!chosen) {
      fb.textContent = "⚠️ No answer selected. " + q.why;
      fb.classList.add("show");
      return;
    }
    const oi = Number(chosen.value);
    const optEls = qEl.querySelectorAll(".quiz-opt");
    optEls[q.answer].classList.add("correct");
    if (oi === q.answer) {
      correct++;
      fb.textContent = "✓ Correct! " + q.why;
    } else {
      optEls[oi].classList.add("wrong");
      fb.textContent = "✗ Not quite. " + q.why;
    }
    fb.classList.add("show");
  });
  const scoreEl = document.getElementById("quizScore");
  const passed = correct >= 3;
  scoreEl.textContent = "You scored " + correct + "/5" + (passed ? " — passed ✓" : " — review and retry");
  scoreEl.className = "quiz-score " + (passed ? "pass" : "fail");
  if (passed) {
    state.done[l.id] = true;
    state.scores[l.id] = correct;
    saveState();
    renderSidebar();
  }
}

    '<div class="stat"><b>' + avgScore + "</b><span>avg quiz score</span></div>" +
    "</div>" +
    '<button class="btn" id="startBtn">Start lesson 1 →</button>' +
    (doneCount > 0 ? '<div style="margin-top:14px"><button class="btn secondary" id="resetBtn">Reset progress</button></div>' : "") +
    "</div>";
  document.getElementById("startBtn").addEventListener("click", () => { current = 0; render(); });
  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", () => {
    if (confirm("Reset all progress and quiz scores?")) {
      state = { done: {}, scores: {} };
      saveState();
      render();
    }
  });
}

/* ================= INIT ================= */
document.getElementById("menuToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});
render();
</script>
</body>
